{% extends 'base.html' %}
{% block content %}
<div class="container form-page">
    <h1 class="section-title title-center">Собрать свой букет</h1>

    <form method="POST" class="form-box constructor-form">
        {% csrf_token %}

        <h3 class="field-title">1. Выберите цветы</h3>
        <div class="flowers-grid block-gap">
            {% for variety in varieties %}
            <div class="flower-item">
                <span class="flower-name">{{ variety.name }} <span class="flower-price">({{ variety.sale_price }} ₽/шт)</span></span>
                <input type="number" name="variety_{{ variety.id }}" value="0" min="0" max="101" class="flower-count">
            </div>
            {% endfor %}
        </div>

        <h3 class="field-title">2. Выберите упаковку</h3>
        <div class="block-gap">
            <select name="packaging" class="form-select">
                <option value="">Без упаковки (крафтовая бумага в подарок)</option>
                {% for pack in packagings %}
                <option value="{{ pack.id }}">{{ pack.name }} (+{{ pack.price }} ₽)</option>
                {% endfor %}
            </select>
        </div>

        <h3 class="field-title">3. Текст открытки</h3>
        <div class="block-gap">
            <textarea name="card_text" placeholder="Ваши пожелания..." class="form-textarea"></textarea>
        </div>

        <button type="submit" class="btn-primary btn-wide btn-lg">Добавить в корзину</button>
    </form>
</div>
{% endblock %}
