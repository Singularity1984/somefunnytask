{% extends 'base.html' %}
{% block content %}
<div class="container form-page form-page-small">
    <h1 class="section-title title-center">Регистрация</h1>

    <form method="POST" class="form-box">
        {% csrf_token %}

        {% for field in form %}
            <div class="field-row">
                <label class="field-label">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="styled-input field-input" required>

                {% if field.help_text %}
                    <small class="field-help">{{ field.help_text }}</small>
                {% endif %}
                {% for error in field.errors %}
                    <small class="field-error">{{ error }}</small>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="btn-primary btn-wide">Создать аккаунт</button>
    </form>

    <p class="form-footer">Уже есть аккаунт? <a href="{% url 'login' %}" class="link-primary">Войти</a></p>
</div>
{% endblock %}
