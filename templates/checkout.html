{% extends 'base.html' %}
{% block content %}
<div class="container form-page form-page-narrow">
    <h1 class="section-title title-center">Оформление заказа</h1>

    <div class="form-box box-gap">
        <h3>Ваш букет готов к заказу!</h3>
        <p class="checkout-sum">Итоговая сумма: <strong class="text-primary">{{ bouquet.total_price }} ₽</strong></p>
    </div>

    <form method="POST" class="form-box">
        {% csrf_token %}

        <h3 class="field-title">Адрес доставки</h3>
        <input type="text" name="address" required placeholder="Город, улица, дом, квартира" class="form-input form-input-gap">

        <h3 class="field-title">Интервал доставки</h3>
        <select name="slot" required class="form-select form-input-gap">
            <option value="">-- Выберите удобное время --</option>
            {% for slot in slots %}
                <option value="{{ slot.id }}">{{ slot.date }} с {{ slot.start_time }} до {{ slot.end_time }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-primary btn-wide btn-lg">Подтвердить заказ</button>
    </form>
</div>
{% endblock %}
