{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 50px 20px; max-width: 600px;">
    <h2 class="section-title" style="text-align: center;">Оформление заказа</h2>
    
    <div style="background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px;">
        <h3>Ваш букет готов к заказу!</h3>
        <p style="font-size: 20px; margin-top: 10px;">Итоговая сумма: <strong style="color: var(--primary);">{{ bouquet.total_price }} ₽</strong></p>
    </div>

    <form method="POST" style="background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05);">
        {% csrf_token %}
        
        <h3 style="margin-bottom: 15px;">Адрес доставки</h3>
        <input type="text" name="address" required placeholder="Город, улица, дом, квартира" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-main); font-size: 16px; margin-bottom: 25px;">
        
        <h3 style="margin-bottom: 15px;">Интервал доставки</h3>
        <select name="slot" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-main); font-size: 16px; margin-bottom: 25px;">
            <option value="">-- Выберите удобное время --</option>
            {% for slot in slots %}
                <option value="{{ slot.id }}">{{ slot.date }} с {{ slot.start_time }} до {{ slot.end_time }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; font-size: 18px;">Подтвердить заказ</button>
    </form>
</div>
{% endblock %}
