{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 50px 20px; max-width: 450px;">
    <h2 class="section-title" style="text-align: center;">Смена пароля</h2>
    <form method="POST" style="background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05);">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Изменить пароль</button>
    </form>
</div>
{% endblock %}
