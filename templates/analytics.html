{% extends 'base.html' %}
{% block content %}
<div class="container panel-page">
    <h1 class="section-title">Аналитика магазина</h1>

    <div class="stats-row">
        <article class="stat-card">
            <h2 class="stat-name">Всего заказов</h2>
            <p id="total-orders" class="stat-value">0</p>
        </article>
        <article class="stat-card">
            <h2 class="stat-name">Выручка (доставлено)</h2>
            <p id="total-revenue" class="stat-value">0 ₽</p>
        </article>
        <article class="stat-card">
            <h2 class="stat-name">Средний чек</h2>
            <p id="avg-check" class="stat-value">0 ₽</p>
        </article>
        <article class="stat-card">
            <h2 class="stat-name">Доля конструктора</h2>
            <p id="custom-share" class="stat-value">0 %</p>
        </article>
    </div>

    <div class="chart-box" id="chart-box" data-url="{% url 'dashboard_api' %}">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    fetch(document.getElementById('chart-box').dataset.url)
        .then(response => response.json())
        .then(data => {
            document.getElementById('total-orders').innerText = data.total_orders;
            document.getElementById('total-revenue').innerText = data.total_revenue + ' ₽';
            document.getElementById('avg-check').innerText = data.avg_check + ' ₽';
            document.getElementById('custom-share').innerText = data.custom_share + ' %';

            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.chart_labels,
                    datasets: [{
                        label: 'Количество заказов по статусам',
                        data: data.chart_data,
                        backgroundColor: '#e91e63'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        });
</script>
{% endblock %}
