{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 50px 20px;">
    <h1 class="section-title">Аналитика магазина</h1>
    
    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
        <div class="card" style="padding:20px; flex:1;">
            <h3>Всего заказов</h3>
            <p id="total-orders" style="font-size: 30px; color: #e91e63;">0</p>
        </div>
        <div class="card" style="padding:20px; flex:1;">
            <h3>Выручка (доставлено)</h3>
            <p id="total-revenue" style="font-size: 30px; color: #e91e63;">0 ₽</p>
        </div>
        <div class="card" style="padding:20px; flex:1;">
            <h3>Средний чек</h3>
            <p id="avg-check" style="font-size: 30px; color: #e91e63;">0 ₽</p>
        </div>
        <div class="card" style="padding:20px; flex:1;">
            <h3>Доля конструктора</h3>
            <p id="custom-share" style="font-size: 30px; color: #e91e63;">0 %</p>
        </div>
    </div>

    <div class="card" style="padding:20px;">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    fetch('/api/dashboard/')
        .then(response => response.json())
        .then(data => {
            document.getElementById('total-orders').innerText = data.total_orders;
            document.getElementById('total-revenue').innerText = data.total_revenue + ' ₽';
            document.getElementById('avg-check').innerText = data.avg_check + ' ₽';

            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.chart_labels,
                    datasets: [{
                        label: 'Количество заказов по статусам',
                        data: data.chart_data,
                        backgroundColor: '#e91e63'
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        });
</script>
{% endblock %}
