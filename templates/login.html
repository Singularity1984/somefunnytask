{% extends 'base.html' %}
{% block content %}
<div class="container form-page form-page-small">
    <h1 class="section-title title-center">Вход в систему</h1>

    <form method="POST" class="form-box">
        {% csrf_token %}

        {% for field in form %}
            <div class="field-row">
                <label class="field-label">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="styled-input field-input" required>

                {% for error in field.errors %}
                    <small class="field-error">{{ error }}</small>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="btn-primary btn-wide">Войти</button>
    </form>

    <p class="form-footer">Нет аккаунта? <a href="{% url 'register' %}" class="link-primary">Зарегистрироваться</a></p>
</div>
{% endblock %}
